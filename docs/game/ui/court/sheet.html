<div class="wrap">
  <h1>Круг 7 · двор как конструктор: земля отдельно, здания отдельно, камера свободная</h1>
  <p class="sub">Один и тот же прототип <code>court/index.html</code> в разных состояниях. Земля — день/ночь; каждое здание — свой спрайт с дневной и ночной версией; сетка 14×14; всё перетаскивается.</p>
  <div class="grid">
    <figure><img src="court-empty-day.jpg" alt=""><figcaption><b>1 · Площадка без строений, день</b><span>С этого начинает игрок. Ни фонарей, ни огней — днём гореть нечему.</span></figcaption></figure>
    <figure><img src="court-empty-night.jpg" alt=""><figcaption><b>2 · Та же площадка, ночь</b><span>Отдельная ночная земля. Интерфейс тот же.</span></figcaption></figure>
    <figure><img src="court-day1-day.jpg" alt=""><figcaption><b>3 · Первый день: Ратуша и частокол</b><span>Решение заказчика 27.09.2026: с начала стоят Ратуша (главное здание, бывшее «Двор») и забор с воротами; остальное игрок ставит сам.</span></figcaption></figure>
    <figure><img src="court-build-ghost.jpg" alt=""><figcaption><b>4 · Стройка: призрак лесопилки</b><span>Карточка «Поставить» → призрак на сетке, зелёный след, ✓ ставит. Клетки одинаковые по всей площадке.</span></figcaption></figure>
    <figure><img src="court-build-move.jpg" alt=""><figcaption><b>5 · Стройка: перестановка</b><span>Здание тянется пальцем; красный след и цвет — место занято, ✓ погашена.</span></figcaption></figure>
    <figure><img src="court-built-night.jpg" alt=""><figcaption><b>6 · Обжитой двор, ночь</b><span>Окна и фонари горят только в ночных спрайтах; стройка Склада с костром и таймером.</span></figcaption></figure>
    <figure><img src="court-built-day.jpg" alt=""><figcaption><b>7 · Обжитой двор, день</b><span>Те же здания, дневной набор. Пины состояний над зданиями.</span></figcaption></figure>
    <figure><img src="court-select.jpg" alt=""><figcaption><b>8 · Тап по зданию</b><span>Пузырь «Улучшить · Переставить · Инфо». «Переставить» запускает то же перетаскивание.</span></figcaption></figure>
    <figure><img src="court-near.jpg" alt=""><figcaption><b>9 · Свободная камера, приближение ×1,7</b><span>Панорама перетаскиванием, зум колесом/щипком в пределах площадки. Спрайты остаются чёткими.</span></figcaption></figure>
  </div>
