name: One-off lockfile and Drizzle snapshot refresh

on:
  push:
    branches:
      - arena/8885a9e3-tg-bot
    paths:
      - pnpm-workspace.yaml
      - package.json
      - pnpm-lock.yaml
      - packages/host/src/db/schema.ts
      - packages/host/drizzle/**
      - .github/workflows/maintenance-refresh.yml

permissions:
  contents: write

concurrency:
  group: tdl-maintenance-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve patched lockfile
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Drizzle schema baseline
        run: pnpm --filter @tdl/host exec drizzle-kit generate --name=schema_snapshot_sync

      - name: Validate and commit baseline
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          test -f packages/host/drizzle/0005_schema_snapshot_sync.sql
          test -f packages/host/drizzle/meta/0005_snapshot.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const journal = JSON.parse(fs.readFileSync('packages/host/drizzle/meta/_journal.json', 'utf8'));
          const last = journal.entries.at(-1);
          if (last?.tag !== '0005_schema_snapshot_sync') throw new Error('Unexpected migration journal tail');
          const previous = JSON.parse(fs.readFileSync('packages/host/drizzle/meta/0001_snapshot.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('packages/host/drizzle/meta/0005_snapshot.json', 'utf8'));
          if (current.prevId !== previous.id) throw new Error('Snapshot chain mismatch');
          const accounts = current.tables?.['public.accounts'];
          const emailIndex = accounts?.indexes?.accounts_email_key_idx;
          if (!emailIndex?.where?.includes('"accounts"."email_key"')) throw new Error('Partial email index is missing from snapshot');
          if (!current.tables?.['public.unit_states'] || !current.tables?.['public.unit_health']) throw new Error('Unit tables missing from snapshot');
          if (!current.tables?.['public.lords']?.indexes?.lords_account_world_idx) throw new Error('Lord/world unique index missing from snapshot');
          const commandPks = Object.values(current.tables?.['public.commands']?.compositePrimaryKeys ?? {});
          if (!commandPks.some((pk) => pk.columns.includes('actor_id'))) throw new Error('Actor-scoped command idempotency key missing');
          fs.writeFileSync('packages/host/drizzle/0005_schema_snapshot_sync.sql',
            '-- Baseline marker: migrations 0002-0004 are already applied; snapshot 0005 records the current schema for Drizzle Kit.\nSELECT 1;\n');
          NODE
          git add pnpm-lock.yaml packages/host/drizzle/0005_schema_snapshot_sync.sql packages/host/drizzle/meta/_journal.json packages/host/drizzle/meta/0005_snapshot.json
          if git diff --cached --quiet; then
            echo 'Patched lockfile and schema baseline are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(db,deps): commit patched lockfile and schema baseline'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
