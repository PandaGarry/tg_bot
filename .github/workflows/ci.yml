name: Проверки TDL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push и pull_request для одной ветки используют одну группу.
  group: tdl-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tdl
          POSTGRES_PASSWORD: tdl
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tdl -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TDL_TEST_SERVER_URL: postgres://tdl:tdl@127.0.0.1:5432/postgres
      TDL_TEST_ADMIN_DB: postgres
      TDL_DRILL_ADMIN_URL: postgres://tdl:tdl@127.0.0.1:5432/postgres
      TDL_DRILL_SOURCE_DB: tdl_backup_source
      CI: "true"
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Установить pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false

      - name: Установить Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Установить зависимости по зафиксированному lockfile
        run: pnpm install --frozen-lockfile

      - name: Проверить типы
        run: pnpm typecheck

      - name: Запустить тесты на отдельной PostgreSQL
        run: pnpm test

      - name: Проверить реестры, границы пакетов, i18n и расписание
        run: pnpm check

      - name: Проверить синтаксис backup/restore scripts
        run: bash -n tools/db/backup.sh tools/db/restore-drill.sh tools/db/ci-restore-drill.sh

      - name: Установить PostgreSQL 18 client для совместимого dump/restore
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Собрать production
        run: pnpm build

      - name: Запустить живой мир и проверить UI в Chromium
        env:
          DATABASE_URL: postgres://tdl:tdl@127.0.0.1:5432/postgres
          SESSION_SECRET: ci-visual-session-secret-2026-only
          PORT: "3000"
          HOST: 127.0.0.1
          WORLD_ID: visual-ci
          WORLD_NAME: "TDL Visual Acceptance"
          REGISTRATION_OPEN: "1"
          ACCESS_MODE: public
          NODE_ENV: development
          ALLOWED_ORIGINS: http://127.0.0.1:3000
          TRUSTED_PROXY_IPS: 127.0.0.1
        run: |
          set -euo pipefail
          pnpm dev > /tmp/tdl-visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ready":true'; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/tdl-visual-server.log
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/tdl-visual-server.log
            echo "::error::Visual test server did not become ready"
            exit 1
          fi
          pnpm walk 3000
          test -s docs/game/ui/client/game-court-day.jpg
          test -s docs/game/ui/client/game-court-buildings.jpg
          test -s docs/game/ui/client/game-court-build.jpg
          test -s docs/game/ui/client/game-court-military.jpg
          test -s docs/game/ui/client/game-court-decor.jpg
          test -s docs/game/ui/client/game-court-portrait.jpg
          test -s docs/game/ui/client/game-court-narrow.jpg

      - name: Сохранить реальные скриншоты игры
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tdl-live-game-screenshots
          path: docs/game/ui/client/game-court-*.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Выполнить настоящий PostgreSQL backup/restore drill
        run: bash tools/db/ci-restore-drill.sh

      - name: Проверить уязвимости зависимостей
        run: pnpm audit --audit-level high

      - name: Проверить уязвимости средней и высокой критичности
        if: always()
        run: pnpm audit --audit-level moderate

      - name: Проверить актуальность Drizzle snapshots
        run: |
          pnpm --filter @tdl/host exec drizzle-kit generate --name=ci_snapshot_drift_check
          if [[ -n "$(git status --porcelain -- packages/host/drizzle)" ]]; then
            git status --short -- packages/host/drizzle
            echo "::error::Drizzle snapshots are out of sync with the current schema. Generate and commit the migration and snapshot."
            exit 1
          fi
