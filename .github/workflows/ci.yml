name: Проверки TDL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push и pull_request для одной ветки используют одну группу.
  group: tdl-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tdl
          POSTGRES_PASSWORD: tdl
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tdl -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TDL_TEST_SERVER_URL: postgres://tdl:tdl@127.0.0.1:5432/postgres
      TDL_TEST_ADMIN_DB: postgres
      CI: "true"
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Установить pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false

      - name: Установить Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Обновить lockfile и установить зависимости
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile

      - name: Проверить типы
        run: pnpm typecheck

      - name: Запустить тесты на отдельной PostgreSQL
        run: pnpm test

      - name: Проверить реестры, границы пакетов, i18n и расписание
        run: pnpm check

      - name: Проверить синтаксис backup/restore scripts
        run: bash -n tools/db/backup.sh tools/db/restore-drill.sh

      - name: Собрать production
        run: pnpm build

      - name: Проверить уязвимости зависимостей
        run: pnpm audit --audit-level high

      - name: Показать оставшиеся moderate advisories
        if: always()
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Сохранить обновлённый pnpm lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-refresh
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Диагностика Drizzle snapshots
        if: always()
        run: |
          pnpm --filter @tdl/host exec drizzle-kit generate --name=ci_snapshot_probe || true
          mkdir -p /tmp/tdl-drizzle-snapshot
          cp -R packages/host/drizzle/. /tmp/tdl-drizzle-snapshot/
          git status --short -- packages/host/drizzle
        continue-on-error: true

      - name: Сохранить Drizzle snapshot probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-snapshot-probe
          path: /tmp/tdl-drizzle-snapshot/
          if-no-files-found: ignore
