<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Двор · 3D-проба · день</title>
    <style>
      html, body, #root { height: 100%; margin: 0; overflow: hidden; background: #aecde8; }
      * { -webkit-tap-highlight-color: transparent; }
      canvas { touch-action: none; display: block; }
      .hud {
        position: fixed; inset: 0; pointer-events: none;
        font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: #f5f1e8;
        text-shadow: 0 1px 2px rgba(20, 25, 40, .55);
      }
      .hud .plate {
        position: absolute; left: 12px; top: 12px;
        background: linear-gradient(180deg, rgba(43,32,24,.92), rgba(30,22,16,.92));
        border: 1px solid rgba(214,178,120,.5); border-radius: 10px;
        padding: 8px 12px; max-width: 340px;
      }
      .hud .plate b { display: block; font-size: 15px; color: #f0d9a8; }
      .hud .hint {
        position: absolute; left: 12px; bottom: 12px;
        background: rgba(30,22,16,.72); border-radius: 8px; padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
