from telegram.ext import Updater, CommandHandler

# Функция для обработки команды /start
def start(update, context):
    context.bot.send_message(chat_id=update.effective_chat.id, text="Привет! Я бот. Напиши /help для списка команд.")

# Функция для обработки команды /help
def help(update, context):
    help_message = """
    Список доступных команд:
    /start - Начать общение с ботом
    /help - Получить список команд
    """
    context.bot.send_message(chat_id=update.effective_chat.id, text=help_message)

def main():
    # Создаем объект Updater и передаем ему токен вашего бота
    updater = Updater(token='6125989607:AAH5tUdUaksqpHuP1m5NiwuayRi0vsWFBuQ', use_context=True)

    # Получаем dispatcher для регистрации обработчиков
    dp = updater.dispatcher

    # Регистрируем обработчики команд
    dp.add_handler(CommandHandler("start", start))
    dp.add_handler(CommandHandler("help", help))

    # Запускаем бота
    updater.start_polling()

    # Останавливаем бота при нажатии Ctrl+C
    updater.idle()

if __name__ == '__main__':
    main()
