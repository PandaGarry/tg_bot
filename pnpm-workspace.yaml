packages:
  - "apps/*"
  - "packages/*"
  - "packages/modules/*"
  - "tools"

# Сборка бинарных зависимостей, которым она нужна.
allowBuilds:
  '@embedded-postgres/darwin-arm64': set this to true or false
  '@embedded-postgres/darwin-x64': set this to true or false
  '@embedded-postgres/linux-arm': set this to true or false
  '@embedded-postgres/linux-arm64': set this to true or false
  '@embedded-postgres/linux-ia32': set this to true or false
  '@embedded-postgres/linux-ppc64': set this to true or false
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': set this to true or false
  '@tailwindcss/oxide': true
  esbuild: true

# Свежесть пакетов: только те, что в реестре дольше двух часов.
# На бою перед сборкой это значение поднимается до суток.
minimumReleaseAge: 60

overrides:
  source-map-js: 1.2.2
  zod: 4.6.7
  esbuild: 0.28.2
  vitest: 5.0.3
  '@vitest/mocker': 5.0.3
